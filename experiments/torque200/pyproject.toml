[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legwheel"
version = "0.1.0"
description = "LegWheel robot: PPO training on MuJoCo MJX + Brax"
readme = "README.md"
requires-python = ">=3.10"

# 完整依赖见 requirements.txt(本包仅声明直接依赖的核心项)
dependencies = [
    "jax",
    "flax",
    "brax",
    "mujoco",
    "mujoco-mjx",
    "ml_collections",
    "orbax-checkpoint",
]

[tool.setuptools]
packages = ["legwheel", "legwheel.training", "legwheel.evaluation", "legwheel.deployment"]
