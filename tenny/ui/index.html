<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>Project Tenny</title>
<style>
:root{--bg:#0f1f17;--fg:#e8e4d0;--gold:#d4af37;--card:#16301f}
body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:24px}
h1{color:var(--gold);font-weight:500;margin:0 0 4px}
h2{color:var(--gold);font-size:13px;letter-spacing:.1em;margin:28px 0 8px}
.task{background:var(--card);padding:10px 14px;margin:6px 0;border-radius:6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.task b{min-width:11em}
input,select{background:#0b160f;color:var(--fg);border:1px solid #345;border-radius:3px;padding:2px 6px}
input:not([type=checkbox]){width:7em}
button{background:var(--gold);border:0;border-radius:4px;padding:4px 14px;cursor:pointer}
button.stop{background:#a33;color:#fff}
pre{background:#08110b;padding:12px;border-radius:6px;height:42vh;overflow:auto;white-space:pre-wrap;margin:0}
a{color:var(--gold)}
</style>
<h1>Project Tenny</h1>
<p>日常训练请进入完整控制台：选择模式、开始或继续训练、停止并保存，以及查看学习曲线和仿真。</p>
<p><button onclick="openConsole()">打开完整训练控制台</button> <span id="console-link"></span></p>
<div id="tasks"></div>
<h2>日志 <span id="cur"></span></h2>
<label>已启动任务 <select id="jobs" onchange="selectJob(this.value)"><option value="">暂无任务</option></select></label>
<pre id="log">选择上方任务并点击"运行"。</pre>
<script>
const $ = s => document.querySelector(s);
let job = null, since = 0, timer = null, knownJobs = [];
const modeLabel = c => ({selected:'上次选择',leg_force_bc:'推荐：腿力＋轮扭矩（老师初始化）· 100 Hz',original:'原版 · 100 Hz',wheel_torque_bc:'腿位置＋轮扭矩（老师初始化）· 100 Hz',torque200:'全扭矩 · 200 Hz',virtual_leg_force:'虚拟腿力',matched_envelope:'匹配包络对照',direct_torque:'直接扭矩对照'}[c] || c.replace(/^hybrid_(.*)_(100|200)$/, (_,mode,hz)=>modeLabel(mode)+' · '+hz+' Hz'));

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function field(p) {
  if (p.type === 'choice')
    return `<select name="${p.name}">${p.choices.map(c => `<option value="${c}" ${c == p.default ? 'selected' : ''}>${modeLabel(c)}</option>`).join('')}</select>`;
  if (p.type === 'flag') return `<input type="checkbox" name="${p.name}" ${p.default ? 'checked' : ''}>`;
  return `<input name="${p.name}" value="${p.default ?? ''}">`;
}

async function init() {
  const tasks = await api('/api/tasks'), groups = {};
  tasks.forEach(t => (groups[t.group] ??= []).push(t));
  $('#tasks').innerHTML = Object.entries(groups).map(([g, ts]) => `<h2>${g}</h2>` + ts.map(t => `
    <div class="task" data-id="${t.id}"><b>${t.name}</b>
      ${(t.params || []).map(p => `<label>${p.label ?? p.name} ${field(p)}</label>`).join('')}
      <button onclick="run('${t.id}')">运行</button></div>`).join('')).join('');
  await recoverJobs();
}

async function recoverJobs(selected) {
  knownJobs = await api('/api/jobs');
  $('#jobs').replaceChildren(...knownJobs.map(j => {
    const o = document.createElement('option');o.value=j.id;o.textContent=j.task+' · '+j.status;return o;
  }));
  const activeWeb = knownJobs.find(j=>j.task==='web' && j.status==='running');
  $('#console-link').replaceChildren();
  if(activeWeb?.url){const a=document.createElement('a');a.href=activeWeb.url;a.target='_blank';a.textContent='进入已启动的训练控制台';$('#console-link').append(a);}
  const chosen = knownJobs.find(j=>j.id===selected) || knownJobs.filter(j=>j.status==='running').at(-1) || knownJobs.at(-1);
  if(chosen){$('#jobs').value=chosen.id;show(chosen);}
}
function selectJob(id){const selected=knownJobs.find(j=>j.id===id);if(selected)show(selected);}
async function openConsole(){
  const jobs=await api('/api/jobs'), active=jobs.find(j=>j.task==='web' && j.status==='running');
  if(active){window.open(active.url,'_blank');await recoverJobs(active.id);}
  else await run('web');
}

function collect(id) {
  const o = {};
  document.querySelectorAll(`[data-id="${id}"] [name]`).forEach(e =>
    o[e.name] = e.type === 'checkbox' ? e.checked : e.value);
  return o;
}

async function run(id) {
  try { const started=await api('/api/run/' + id, collect(id));await recoverJobs(started.id); } catch (e) { alert(e.message); }
}

async function stopJob() { if (job) await api('/api/stop/' + job.id, {}); }

function show(j) {
  job = j; since = 0; $('#log').textContent = '';
  clearInterval(timer); timer = setInterval(poll, 700); poll();
}

async function poll() {
  const j = await api(`/api/jobs/${job.id}?since=${since}`);
  const pre = $('#log'), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent += j.lines.map(l => l + '\n').join('');
  since = j.next;
  if (atEnd) pre.scrollTop = pre.scrollHeight;
  $('#cur').innerHTML = `${j.task} · ${j.status}`
    + (j.url ? ` · <a target="_blank" href="${j.url}">${j.url}</a>` : '')
    + (j.status === 'running' ? ' <button class="stop" onclick="stopJob()">停止</button>' : '');
  if (j.status !== 'running') clearInterval(timer);
}

init();
</script>
</html>
